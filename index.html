<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sand Clicker</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f7dc6f;
            --primary-color: #d68910;
            --text-color: #5d4037;
            --card-bg: #fef9e7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            text-align: center;
            user-select: none;
        }

        h1 { margin-bottom: 5px; }

        .score-board {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Навигация */
        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
        }

        .tab-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Кликер */
        .click-container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
        }

        .sand-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, #f5b041, #b9770e);
            border: 6px solid #7e5109;
            font-size: 22px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.05s;
        }

        .sand-btn:active {
            transform: scale(0.92);
        }

        /* Всплывающие цифры при клике */
        .floating-text {
            position: absolute;
            color: #d35400;
            font-weight: bold;
            font-size: 24px;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }

        /* Сетка Базы 3x3 */
        .base-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .grid-cell {
            aspect-ratio: 1;
            background: #edbb99;
            border: 2px dashed #a04000;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
        }

        /* Магазин и Улучшения */
        .shop-item {
            background: var(--card-bg);
            border: 1px solid #d5dbdb;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .buy-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🏜️ Sand Clicker</h1>
    <div class="score-board">
        ⏳ Песок: <span id="sand-count">0</span>
    </div>

    <!-- Вкладки -->
    <div class="tabs">
        <button class="tab-btn" onclick="openTab('clicker-tab')">⏳ Кликер</button>
        <button class="tab-btn" onclick="openTab('upgrades-tab')">🛠 Улучшения</button>
        <button class="tab-btn" onclick="openTab('jars-tab')">🏺 Магазин</button>
        <button class="tab-btn" onclick="openTab('base-tab')">🏜 База</button>
    </div>

    <!-- 1. Вкладка Кликера -->
    <div id="clicker-tab" class="tab-content active">
        <div class="click-container" id="click-area">
            <button class="sand-btn" id="click-btn">КЛИК!</button>
        </div>
        <p>Сила клика: <span id="click-power">1</span></p>
    </div>

    <!-- 2. Вкладка Улучшений -->
    <div id="upgrades-tab" class="tab-content">
        <h3>Улучшения</h3>
        <div class="shop-item">
            <div>
                <strong>Сила лопаты (+1 к клику)</strong><br>
                Цена: <span id="shovel-cost">10</span> ⏳
            </div>
            <button class="buy-btn" onclick="buyShovel()">Купить</button>
        </div>
    </div>

    <!-- 3. Вкладка Магазина баночек -->
    <div id="jars-tab" class="tab-content">
        <h3>Баночки с песком</h3>
        <div class="shop-item">
            <div>
                <strong>Баночка удвоения (+2 к клику)</strong><br>
                Цена: 50 ⏳
            </div>
            <button class="buy-btn" onclick="buyDoubleJar()">Купить</button>
        </div>
    </div>

    <!-- 4. Вкладка Базы (Сетка 3x3) -->
    <div id="base-tab" class="tab-content">
        <h3>Ваша База (3x3)</h3>
        <div class="base-grid" id="grid">
            <!-- 9 клеток генерируются через JS -->
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Состояние игры
        let state = {
            sand: 0,
            clickPower: 1,
            shovelCost: 10,
            hasDoubleJar: false,
            grid: Array(9).fill(null) // Пустые клетки
        };

        // Переключение вкладок
        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        // Обновление UI
        function updateUI() {
            document.getElementById('sand-count').innerText = state.sand;
            document.getElementById('click-power').innerText = state.clickPower + (state.hasDoubleJar ? 2 : 0);
            document.getElementById('shovel-cost').innerText = state.shovelCost;
            renderGrid();
        }

        // Клик по кнопке
        const clickBtn = document.getElementById('click-btn');
        const clickArea = document.getElementById('click-area');

        clickBtn.addEventListener('click', (e) => {
            let gain = state.clickPower + (state.hasDoubleJar ? 2 : 0);
            state.sand += gain;

            // Виброотклик Telegram Mini App
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            // Анимация текста +N
            showFloatingText(`+${gain}`, e.clientX, e.clientY);
            updateUI();
        });

        function showFloatingText(text, x, y) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            const rect = clickArea.getBoundingClientRect();
            el.style.left = `${x - rect.left}px`;
            el.style.top = `${y - rect.top}px`;
            clickArea.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // Покупка лопаты
        function buyShovel() {
            if (state.sand >= state.shovelCost) {
                state.sand -= state.shovelCost;
                state.clickPower += 1;
                state.shovelCost = Math.floor(state.shovelCost * 1.5);
                updateUI();
            } else {
                tg.showAlert("Недостаточно песка!");
            }
        }

        // Покупка баночки
        function buyDoubleJar() {
            if (state.hasDoubleJar) {
                tg.showAlert("У вас уже есть эта баночка!");
                return;
            }
            if (state.sand >= 50) {
                state.sand -= 50;
                state.hasDoubleJar = true;
                updateUI();
            } else {
                tg.showAlert("Недостаточно песка!");
            }
        }

        // Рендер сетки базы
        function renderGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            state.grid.forEach((building, idx) => {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.innerText = building ? building : '🏜️';
                cell.onclick = () => buildOnCell(idx);
                gridEl.appendChild(cell);
            });
        }

        // Строительство на базе
        function buildOnCell(idx) {
            if (state.grid[idx]) {
                tg.showAlert("Здесь уже что-то построено!");
                return;
            }
            if (state.sand >= 100) {
                state.sand -= 100;
                state.grid[idx] = '🏭'; // Постройка: Песчаный карьер
                updateUI();
            } else {
                tg.showAlert("Постройка стоит 100 песка!");
            }
        }

        // Инициализация
        updateUI();
    </script>
</body>
</html>
